# -----------------------------------------------------------------------------
# Noir Player (Android) - release
#
# Trigger: push a tag `v<version>` matching pubspec.yaml (version 1.1.3+5 ->
# tag v1.1.3). Can also be re-run with "Run workflow", choosing the existing
# tag as the ref.
#
# Flow: validate tag/version -> CI checks + APK build (ci.yml) -> publish.
# The GitHub release is only created/updated after every check passed.
#
# Assets: NoirPlayer-v<version>.apk, NoirPlayer-v<version>.apk.sha256, SHA256SUMS
#
# Release notes - the first source found wins:
#   1. CHANGELOG.md section headed `## [1.1.3]`, `## v1.1.3` or `## 1.1.3`
#      (anything after the version on that line is ignored)
#   2. release-notes/v1.1.3.md
#   3. the annotated tag's message (`git tag -a v1.1.3 -m "..."`)
#   4. GitHub's auto-generated notes
#   If the notes (from 1-3) start with a `# Heading` line, that line becomes
#   the release title; otherwise the title is "Noir Player v1.1.3". A short
#   install/checksum footer is appended.
#
# Signing: a tagged release must be signed with the release keystore (see
# ci.yml) so users can update in place. To deliberately publish a
# debug-signed APK, set repository variable ALLOW_DEBUG_SIGNED_RELEASE=true.
#
# iOS: the iOS workflow (ios.yml) builds the IPA for the same tag, waits for
# the release this workflow creates and uploads the IPA to it. Only this
# workflow creates the release and sets its title and notes.
# -----------------------------------------------------------------------------
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check tag matches pubspec.yaml version
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('pubspec.yaml').read_text()
          m = re.search(r'^version:\s*["\']?([^\s"\'#]+)', text, re.M)
          assert m, 'No version: line in pubspec.yaml'
          full = m.group(1)
          version = full.split('+', 1)[0]
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version), f'Unsupported version {full!r}'
          expected = f'refs/tags/v{version}'
          ref = os.environ['RELEASE_REF']
          if ref != expected:
              print(f'::error::Ref {ref} does not match pubspec.yaml version {full} (expected tag v{version}).')
              raise SystemExit(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\n')
              out.write(f"prerelease={'true' if '-' in version else 'false'}\n")
          print(f'Releasing v{version} (pubspec {full})')
          PY

  checks:
    name: CI
    needs: validate
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read

  publish:
    name: Publish GitHub release
    needs: [validate, checks]
    if: github.repository == 'Abdullah-Masood-05/NoirPlayer'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      SIGNED: ${{ needs.checks.outputs.signed }}
      ALLOW_DEBUG_SIGNED: ${{ vars.ALLOW_DEBUG_SIGNED_RELEASE }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require release signing
        run: |
          if [ "$SIGNED" != "true" ]; then
            if [ "$ALLOW_DEBUG_SIGNED" = "true" ]; then
              echo "::warning title=Debug-signed release::Publishing a debug-signed APK (ALLOW_DEBUG_SIGNED_RELEASE=true). It will not install as an update over earlier releases."
            else
              echo "::error::The APK was not signed with the release keystore. Set the ANDROID_* signing secrets (see ci.yml), or set repository variable ALLOW_DEBUG_SIGNED_RELEASE=true to publish anyway."
              exit 1
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch annotated tag
        run: git fetch --force --no-tags --depth=1 "https://github.com/${GH_REPO}.git" "refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.checks.outputs.artifact }}
          path: build-apk

      - name: Rename APK and write checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="NoirPlayer-v${VERSION}.apk"
          mv build-apk/app-release.apk "dist/$apk"
          test -s "dist/$apk"
          cd dist
          sha256sum "$apk" > "$apk.sha256"
          cp "$apk.sha256" SHA256SUMS
          sha256sum --check SHA256SUMS
          ls -l

      - name: Assemble release notes
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          version, tag = os.environ['VERSION'], os.environ['TAG']
          notes, source = '', None

          changelog = pathlib.Path('CHANGELOG.md')
          if changelog.is_file():
              pattern = r'^##\s+(?:\[v?' + re.escape(version) + r'\]|v?' + re.escape(version) + r'\b)[^\n]*\n(.*?)(?=^##\s|\Z)'
              m = re.search(pattern, changelog.read_text(), re.M | re.S)
              if m and m.group(1).strip():
                  notes, source = m.group(1).strip(), 'CHANGELOG.md'

          notes_file = pathlib.Path('release-notes') / f'{tag}.md'
          if not notes and notes_file.is_file() and notes_file.read_text().strip():
              notes, source = notes_file.read_text().strip(), str(notes_file)

          if not notes:
              kind = subprocess.run(['git', 'cat-file', '-t', tag], capture_output=True, text=True).stdout.strip()
              if kind == 'tag':
                  msg = subprocess.run(['git', 'tag', '-l', '--format=%(contents:subject)%0a%0a%(contents:body)', tag],
                                       capture_output=True, text=True, check=True).stdout.strip()
                  if msg and msg != tag:
                      notes, source = msg, 'tag message'

          title = f'Noir Player {tag}'
          lines = notes.splitlines()
          if lines and re.match(r'^#\s+\S', lines[0]):
              title = lines[0][1:].strip()
              notes = '\n'.join(lines[1:]).strip()

          apk = f'NoirPlayer-v{version}.apk'
          footer = (f'### Install\n'
                    f'Download **`{apk}`** below. You may need to allow installing from unknown sources.\n'
                    f'Verify the download against `SHA256SUMS` (`sha256sum --check SHA256SUMS`).\n')
          if notes:
              body = notes + '\n\n' + footer
          else:
              body = footer
          pathlib.Path('release-notes.md').write_text(body)
          pathlib.Path('release-title.txt').write_text(title)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"GENERATE_NOTES={'false' if source else 'true'}\n")
          print(f'Title: {title}\nNotes source: {source or "GitHub auto-generated"}')
          PY

      - name: Create or update release
        run: |
          set -euo pipefail
          title="$(cat release-title.txt)"
          assets=(dist/*.apk dist/*.apk.sha256 dist/SHA256SUMS)

          update_existing() {
            echo "Release $TAG already exists (e.g. a re-run); updating its Android assets, title and notes."
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$title" --notes-file release-notes.md
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            update_existing
            exit 0
          fi

          args=(--verify-tag --title "$title" --notes-file release-notes.md)
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          [ "$GENERATE_NOTES" = "true" ] && args+=(--generate-notes)

          if ! gh release create "$TAG" "${assets[@]}" "${args[@]}"; then
            # Another workflow may have created it in the meantime.
            if gh release view "$TAG" >/dev/null 2>&1; then
              update_existing
            else
              exit 1
            fi
          fi
