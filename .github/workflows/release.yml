# -----------------------------------------------------------------------------
# Noir Player - release
#
# Trigger: push a tag `v<version>` matching pubspec.yaml (version 1.2.0+6 ->
# tag v1.2.0). To publish (or re-publish) an existing tag by hand, use
# "Run workflow" and enter the tag, or: gh workflow run release.yml -f tag=v1.2.0
#
# Nothing is rebuilt here. The release publishes the exact builds CI already
# made for the tagged commit:
#   ci.yml  (push / workflow_dispatch run) -> artifact noir-player-android-<sha>
#   ios.yml (push / workflow_dispatch run) -> artifact noir-player-ios-<sha>
#
# Flow:
#   1. prepare: check the tag matches pubspec.yaml, resolve the tagged commit,
#      then find the successful ci.yml and ios.yml runs for it. A run that is
#      still going is waited for (bounded); if there is no green run the job
#      fails and asks you to wait for CI to go green (or start it on the tag:
#      gh workflow run ci.yml --ref v<version> / gh workflow run ios.yml --ref
#      v<version>) and then re-run this workflow.
#   2. publish: download both artifacts, refuse debug-signed Android builds,
#      name the files, write checksums and create ONE GitHub release with
#      every asset.
#
# Assets:
#   NoirPlayer-v<version>.apk               universal APK (+ .sha256)
#   NoirPlayer-v<version>-arm64-v8a.apk     per-ABI APKs (+ .sha256 each)
#   NoirPlayer-v<version>-armeabi-v7a.apk
#   NoirPlayer-v<version>-x86_64.apk
#   NoirPlayer-v<version>.aab               App Bundle (+ .sha256)
#     The per-ABI APKs and the .aab are skipped (not an error) when the CI
#     artifact predates them.
#   NoirPlayer-iOS-v<version>-unsigned.ipa  (+ .sha256; `NoirPlayer-iOS-v<version>.ipa`
#                                            when ios.yml produced a signed build)
#   SHA256SUMS                              (all of the above)
#
# Release notes - the first source found wins:
#   1. CHANGELOG.md section headed `## [1.2.0]`, `## v1.2.0` or `## 1.2.0`.
#      Text after the version on that line (`## [1.2.0] - Short title`, an
#      optional ISO date first is skipped) becomes the title "v1.2.0 - Short title".
#   2. release-notes/v1.2.0.md
#   3. the annotated tag's message (`git tag -a v1.2.0 -m "..."`)
#   4. GitHub's auto-generated notes
#   If the notes (from 1-3) start with a `# Heading` line, that line becomes
#   the title. Otherwise the title is "Noir Player v1.2.0". A short downloads /
#   checksum footer is appended.
#
# Signing: release APKs and the App Bundle must be signed with the release
# keystore (see ci.yml) so users can update in place. APK certificates are
# checked with apksigner, the bundle's with keytool; a debug certificate is
# refused unless repository variable ALLOW_DEBUG_SIGNED_RELEASE=true. If
# repository variable ANDROID_RELEASE_CERT_SHA256 is set, every build's signing
# certificate SHA-256 must match it.
# -----------------------------------------------------------------------------
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v1.2.0
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # How long to wait for a CI build of the tagged commit that is still running.
  CI_WAIT_MINUTES: '60'
  IOS_WAIT_MINUTES: '90'

jobs:
  prepare:
    name: Validate tag and find CI builds
    if: github.repository == 'Abdullah-Masood-05/NoirPlayer'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.commit.outputs.sha }}
      android_run: ${{ steps.runs.outputs.android_run }}
      ios_run: ${{ steps.runs.outputs.ios_run }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check tag name
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$TAG' is not a version tag like v1.2.0."
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Check tag matches pubspec.yaml version
        id: version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('pubspec.yaml').read_text()
          m = re.search(r'^version:\s*["\']?([^\s"\'#]+)', text, re.M)
          assert m, 'No version: line in pubspec.yaml'
          full = m.group(1)
          version = full.split('+', 1)[0]
          assert re.fullmatch(r'\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', version), f'Unsupported version {full!r}'
          tag = os.environ['TAG']
          if tag != f'v{version}':
              print(f'::error::Tag {tag} does not match pubspec.yaml version {full} (expected tag v{version}).')
              raise SystemExit(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\n')
              out.write(f"prerelease={'true' if '-' in version else 'false'}\n")
          print(f'Releasing v{version} (pubspec {full})')
          PY

      - name: Resolve tagged commit
        id: commit
        run: |
          sha="$(git rev-parse HEAD)"
          echo "Tag $TAG points at $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Find successful CI builds for the tagged commit
        id: runs
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail

          # find_run <workflow file> <artifact prefix> <max wait minutes>
          # Prints the id of the newest successful push/workflow_dispatch run of
          # the workflow for $SHA that still has the artifact <prefix>-$SHA.
          find_run() {
            local wf="$1" prefix="$2" wait_min="$3"
            local start deadline runs run_id pending total failed artifact
            start=$(date +%s)
            deadline=$(( start + wait_min * 60 ))
            artifact="${prefix}-${SHA}"
            while :; do
              if ! runs="$(gh api "repos/${GH_REPO}/actions/workflows/${wf}/runs?head_sha=${SHA}&per_page=100" \
                     --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")]')"; then
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "::error::Could not list ${wf} runs from the GitHub API." >&2
                  return 1
                fi
                echo "::warning::Listing ${wf} runs failed; retrying in 30s." >&2
                sleep 30
                continue
              fi
              run_id="$(jq -r '[.[] | select(.conclusion == "success")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
              if [ -n "$run_id" ]; then
                if [ "$(gh api "repos/${GH_REPO}/actions/runs/${run_id}/artifacts?name=${artifact}" \
                       --jq '[.artifacts[] | select(.expired | not)] | length')" -eq 0 ]; then
                  echo "::error::${wf} run ${run_id} for ${SHA} has no artifact ${artifact} (it may have expired). Run it again on the tag (gh workflow run ${wf} --ref ${TAG}), wait for it to go green, then re-run this workflow." >&2
                  return 1
                fi
                echo "${wf}: using run ${run_id} (artifact ${artifact})" >&2
                echo "$run_id"
                return 0
              fi
              total="$(jq 'length' <<<"$runs")"
              pending="$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")"
              failed="$(jq -r '[.[] | select(.status == "completed")] | sort_by(.created_at) | last | .conclusion // empty' <<<"$runs")"
              # Runs can take a moment to appear right after a push.
              if [ "$total" -eq 0 ] && [ $(( $(date +%s) - start )) -lt 300 ]; then
                pending=1
              fi
              if [ "$pending" -eq 0 ]; then
                if [ -n "$failed" ]; then
                  echo "::error::The latest ${wf} run for ${SHA} finished as '${failed}'. Wait for CI to go green on this commit (fix it, or re-run it with: gh workflow run ${wf} --ref ${TAG}), then re-run this workflow." >&2
                else
                  echo "::error::No ${wf} run exists for ${SHA}. Wait for CI to go green on this commit (start it with: gh workflow run ${wf} --ref ${TAG}), then re-run this workflow." >&2
                fi
                return 1
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::${wf} has not finished for ${SHA} after ${wait_min} minutes. Wait for CI to go green, then re-run this workflow." >&2
                return 1
              fi
              echo "${wf}: build for ${SHA} still running; checking again in 30s..." >&2
              sleep 30
            done
          }

          android_run="$(find_run ci.yml noir-player-android "$CI_WAIT_MINUTES")"
          ios_run="$(find_run ios.yml noir-player-ios "$IOS_WAIT_MINUTES")"
          {
            echo "android_run=$android_run"
            echo "ios_run=$ios_run"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish GitHub release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload its assets
      actions: read   # download artifacts from the CI runs
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      SHA: ${{ needs.prepare.outputs.sha }}
      ALLOW_DEBUG_SIGNED: ${{ vars.ALLOW_DEBUG_SIGNED_RELEASE }}
      EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Fetch annotated tag
        run: git fetch --force --no-tags --depth=1 "https://github.com/${GH_REPO}.git" "refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Download Android builds from CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: noir-player-android-${{ needs.prepare.outputs.sha }}
          path: build-apk
          run-id: ${{ needs.prepare.outputs.android_run }}
          github-token: ${{ github.token }}

      - name: Download IPA from the iOS build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: noir-player-ios-${{ needs.prepare.outputs.sha }}
          path: build-ipa
          run-id: ${{ needs.prepare.outputs.ios_run }}
          github-token: ${{ github.token }}

      # CI artifacts made before the split APKs / App Bundle were added hold
      # only app-release.apk at their root; newer ones hold flutter-apk/ and
      # bundle/release/. Locate every file by name so both layouts work.
      - name: Locate Android builds
        run: |
          set -euo pipefail
          find_one() { find build-apk -type f -name "$1" | sort | head -n 1; }
          universal="$(find_one app-release.apk)"
          if [ -z "$universal" ] || [ ! -s "$universal" ]; then
            echo "::error::app-release.apk is missing or empty in the CI artifact. Contents of build-apk:"
            ls -laR build-apk || true
            exit 1
          fi
          {
            echo "APK_UNIVERSAL=$universal"
            echo "APK_ARM64=$(find_one app-arm64-v8a-release.apk)"
            echo "APK_ARMV7=$(find_one app-armeabi-v7a-release.apk)"
            echo "APK_X86_64=$(find_one app-x86_64-release.apk)"
            echo "AAB=$(find_one app-release.aab)"
          } >> "$GITHUB_ENV"
          find build-apk -type f -exec ls -l {} +

      - name: Require release signing
        run: |
          # Every failure path below prints an ::error:: with the reason; no
          # command is allowed to end the step silently.
          set -uo pipefail
          apks=()
          for f in "$APK_UNIVERSAL" "$APK_ARM64" "$APK_ARMV7" "$APK_X86_64"; do
            if [ -n "$f" ]; then apks+=("$f"); fi
          done

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          # Newest build-tools wins (an unmatched glob stays literal and fails -x).
          apksigner="$(printf '%s\n' "$sdk"/build-tools/*/apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            echo "::error::apksigner was not found under $sdk/build-tools on this runner, so the APK signature cannot be checked."
            exit 1
          fi
          echo "Using $apksigner"

          expected=""
          if [ -n "${EXPECTED_CERT_SHA256:-}" ]; then
            expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')"
          fi
          debug_seen=false

          # check_cert <file> <signer DN lines> <normalised SHA-256 digests>
          check_cert() {
            local file="$1" dns="$2" digests="$3"
            if [ -z "$dns" ] || [ -z "$digests" ]; then
              echo "::error::Could not read the signing certificate (DN and SHA-256 digest) of $file from the output above; the output format may have changed."
              return 1
            fi
            echo "$file: signer DN(s): $(printf '%s' "$dns" | paste -sd ';' -)"
            echo "$file: signer certificate SHA-256: $(printf '%s' "$digests" | paste -sd ' ' -)"
            if printf '%s\n' "$dns" | grep -q 'CN=Android Debug'; then
              if [ "${ALLOW_DEBUG_SIGNED:-}" = "true" ]; then
                debug_seen=true
                return 0
              fi
              echo "::error::$file from the CI build of ${SHA} is signed with the debug key. Set the ANDROID_* signing secrets (see ci.yml), re-run CI on this commit, then re-run this workflow. To publish anyway, set repository variable ALLOW_DEBUG_SIGNED_RELEASE=true."
              return 1
            fi
            # Every signer (v1/v2/v3...) must use the release certificate.
            if [ -n "$expected" ] && [ "$digests" != "$expected" ]; then
              echo "::error::$file is signed with certificate(s) $(printf '%s' "$digests" | paste -sd ' ' -), not the release certificate ${expected} in ANDROID_RELEASE_CERT_SHA256."
              return 1
            fi
          }

          for apk in "${apks[@]}"; do
            status=0
            out="$("$apksigner" verify --print-certs "$apk" 2>&1)" || status=$?
            echo "----- apksigner verify --print-certs $apk -----"
            printf '%s\n' "$out"
            echo "----- exit status: $status -----"
            if [ "$status" -ne 0 ]; then
              echo "::error::apksigner verify failed (exit status $status) for $apk; see its output above."
              exit 1
            fi
            # apksigner's output format differs between build-tools versions:
            #   <= 36.x: "Signer #1 certificate DN: ..." / "Signer #1 certificate SHA-256 digest: ..."
            #   >= 37:   "V2 Signer: certificate DN: ..." / "V2 Signer: certificate SHA-256 digest: ..."
            # (and "Signer (minSdkVersion=..) ..." for SDK-targeted v3.1 signers).
            # Accept any "<...Signer...> certificate <field>: <value>" line.
            signer_re='^[^:]*Signer[^:]*:? certificate'
            dns="$(printf '%s\n' "$out" | sed -nE "s/${signer_re} DN: //p")"
            digests="$(printf '%s\n' "$out" | sed -nE "s/${signer_re} SHA-256 digest: //p" | tr -d ': ' | tr 'A-F' 'a-f' | sort -u)"
            check_cert "$apk" "$dns" "$digests" || exit 1
          done

          # An App Bundle carries a JAR (v1) signature, which apksigner does not
          # read; keytool prints its certificate instead.
          if [ -n "$AAB" ]; then
            status=0
            out="$(keytool -printcert -jarfile "$AAB" 2>&1)" || status=$?
            echo "----- keytool -printcert -jarfile $AAB -----"
            printf '%s\n' "$out"
            echo "----- exit status: $status -----"
            if [ "$status" -ne 0 ] || printf '%s\n' "$out" | grep -qi 'not a signed jar'; then
              echo "::error::Could not read a signature from $AAB; see the keytool output above."
              exit 1
            fi
            dns="$(printf '%s\n' "$out" | sed -nE 's/^[[:space:]]*Owner: //p')"
            digests="$(printf '%s\n' "$out" | sed -nE 's/^[[:space:]]*SHA256: //p' | tr -d ': ' | tr 'A-F' 'a-f' | sort -u)"
            check_cert "$AAB" "$dns" "$digests" || exit 1
          fi

          if [ "$debug_seen" = "true" ]; then
            echo "::warning title=Debug-signed release::Publishing debug-signed Android builds (ALLOW_DEBUG_SIGNED_RELEASE=true). They will not install as an update over other releases."
          elif [ -n "$expected" ]; then
            echo "Every Android build is signed with the ANDROID_RELEASE_CERT_SHA256 certificate."
          else
            echo "::notice::ANDROID_RELEASE_CERT_SHA256 is not set; the Android builds are release-signed (not debug) but their certificate was not pinned."
          fi

      - name: Name files and write checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="NoirPlayer-v${VERSION}.apk"
          cp "$APK_UNIVERSAL" "dist/$apk"
          files=("$apk")
          # add <source path, may be empty> <release file name>: the split APKs
          # and the App Bundle are only in artifacts from the current ci.yml.
          add() {
            if [ -n "$1" ]; then cp "$1" "dist/$2"; files+=("$2"); fi
          }
          add "$APK_ARM64"  "NoirPlayer-v${VERSION}-arm64-v8a.apk"
          add "$APK_ARMV7"  "NoirPlayer-v${VERSION}-armeabi-v7a.apk"
          add "$APK_X86_64" "NoirPlayer-v${VERSION}-x86_64.apk"
          add "$AAB"        "NoirPlayer-v${VERSION}.aab"
          {
            echo "HAS_SPLITS=$([ -n "$APK_ARM64$APK_ARMV7$APK_X86_64" ] && echo true || echo false)"
            echo "HAS_AAB=$([ -n "$AAB" ] && echo true || echo false)"
          } >> "$GITHUB_ENV"

          mapfile -t ipas < <(find build-ipa -type f -name '*.ipa' | sort)
          if [ "${#ipas[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .ipa in the iOS artifact, found ${#ipas[@]}: ${ipas[*]:-none}"
            exit 1
          fi
          case "${ipas[0]}" in
            *-unsigned.ipa) ipa="NoirPlayer-iOS-v${VERSION}-unsigned.ipa" ;;
            *)              ipa="NoirPlayer-iOS-v${VERSION}.ipa" ;;
          esac
          cp "${ipas[0]}" "dist/$ipa"
          files+=("$ipa")
          echo "IPA_NAME=$ipa" >> "$GITHUB_ENV"

          cd dist
          : > SHA256SUMS
          for f in "${files[@]}"; do
            test -s "$f"
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256" >> SHA256SUMS
          done
          sha256sum --check SHA256SUMS
          ls -l

      - name: Assemble release notes
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          version, tag, ipa = os.environ['VERSION'], os.environ['TAG'], os.environ['IPA_NAME']
          notes, source, title = '', None, None

          changelog = pathlib.Path('CHANGELOG.md')
          if changelog.is_file():
              pattern = (r'^##\s+(?:\[v?' + re.escape(version) + r'\]|v?' + re.escape(version) + r'\b)'
                         r'([^\n]*)\n(.*?)(?=^##\s|\Z)')
              m = re.search(pattern, changelog.read_text(encoding='utf-8'), re.M | re.S)
              if m and m.group(2).strip():
                  notes, source = m.group(2).strip(), 'CHANGELOG.md'
                  suffix = re.sub(r'^[\s\-–—:]*', '', m.group(1))
                  suffix = re.sub(r'^\d{4}-\d{2}-\d{2}[\s\-–—:]*', '', suffix).strip()
                  if suffix:
                      title = f'{tag} - {suffix}'

          notes_file = pathlib.Path('release-notes') / f'{tag}.md'
          if not notes and notes_file.is_file() and notes_file.read_text(encoding='utf-8').strip():
              notes, source = notes_file.read_text(encoding='utf-8').strip(), str(notes_file)

          if not notes:
              kind = subprocess.run(['git', 'cat-file', '-t', tag], capture_output=True, text=True).stdout.strip()
              if kind == 'tag':
                  msg = subprocess.run(['git', 'tag', '-l', '--format=%(contents:subject)%0a%0a%(contents:body)', tag],
                                       capture_output=True, text=True, check=True).stdout.strip()
                  if msg and msg != tag:
                      notes, source = msg, 'tag message'

          lines = notes.splitlines()
          if lines and re.match(r'^#\s+\S', lines[0]):
              title = lines[0][1:].strip()
              notes = '\n'.join(lines[1:]).strip()
          title = title or f'Noir Player {tag}'

          apk = f'NoirPlayer-v{version}.apk'
          ipa_line = (f'- **iPhone / iPad:** `{ipa}` is not signed; sideload it with a tool such as Sideloadly or AltStore.\n'
                      if ipa.endswith('-unsigned.ipa') else
                      f'- **iPhone / iPad:** `{ipa}`.\n')
          android_lines = f'- **Android:** `{apk}` works on every phone. You may need to allow installing from unknown sources.\n'
          if os.environ.get('HAS_SPLITS') == 'true':
              android_lines += (f'- **Android, smaller download:** `NoirPlayer-v{version}-arm64-v8a.apk` suits almost every '
                                'phone from the last few years (`armeabi-v7a` for older 32-bit phones, `x86_64` for '
                                'emulators and Chromebooks). Once you install one of these, keep updating with the same '
                                'file: Android will not install the universal APK over it.\n')
          if os.environ.get('HAS_AAB') == 'true':
              android_lines += (f'- **Android App Bundle:** `NoirPlayer-v{version}.aab` is for app stores and '
                                '`bundletool`; it cannot be installed by tapping it.\n')
          footer = ('### Downloads\n'
                    + android_lines
                    + ipa_line +
                    '- Check a download against `SHA256SUMS` with `sha256sum --check SHA256SUMS --ignore-missing`.\n')
          body = notes + '\n\n' + footer if notes else footer
          pathlib.Path('release-notes.md').write_text(body, encoding='utf-8')
          pathlib.Path('release-title.txt').write_text(title, encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"GENERATE_NOTES={'false' if source else 'true'}\n")
          print(f'Title: {title}\nNotes source: {source or "GitHub auto-generated"}')
          PY

      - name: Create or update release
        run: |
          set -euo pipefail
          title="$(cat release-title.txt)"
          assets=(dist/*.apk dist/*.ipa dist/*.sha256 dist/SHA256SUMS)
          if compgen -G 'dist/*.aab' >/dev/null; then assets+=(dist/*.aab); fi

          update_existing() {
            echo "Release $TAG already exists (e.g. a re-run); updating its assets, title and notes."
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$title" --notes-file release-notes.md
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            update_existing
            exit 0
          fi

          args=(--verify-tag --title "$title" --notes-file release-notes.md)
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          [ "$GENERATE_NOTES" = "true" ] && args+=(--generate-notes)

          if ! gh release create "$TAG" "${assets[@]}" "${args[@]}"; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              update_existing
            else
              exit 1
            fi
          fi
