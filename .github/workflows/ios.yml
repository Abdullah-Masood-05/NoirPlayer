# -----------------------------------------------------------------------------
# Noir Player — iOS build workflow (macOS runners)
#
# Produces an iOS IPA and uploads it as a GitHub Actions artifact.
#   - Unsigned by default (no Apple secrets needed): builds with --no-codesign.
#   - Signed when Apple signing secrets are provided (see docs/iOS_BUILD_GUIDE.md).
# No other secrets are needed: Discover is configured at runtime, not at build
# time.
#
# TRIGGERS
#   push (every branch; tags do not trigger it) / pull_request / workflow_dispatch
#   Every run uploads the artifact `noir-player-ios-<commit sha>` (kept for
#   30 days). Releases reuse it: when a `v*` tag is pushed, release.yml finds
#   the successful push run of this workflow for the tagged commit and
#   attaches its IPA to the release, so tags do not trigger another macOS
#   build. If the tagged commit has no green run here (e.g. its artifact
#   expired), run this workflow on the tag first:
#     gh workflow run ios.yml --ref v<version>
#   NOTE: GitHub Actions workflows run from the pushed branch (not only main).
#   The only main-branch quirk is the manual "Run workflow" UI button — it
#   only appears once this file is on the default branch. On a feature branch
#   use: gh workflow run ios.yml --ref <branch>
# -----------------------------------------------------------------------------
name: Build iOS IPA

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      signing_enabled:
        description: 'Sign the IPA (requires Apple secrets). Off = unsigned build.'
        type: boolean
        required: false
        default: false
      export_method:
        description: 'Export method for signed builds'
        type: choice
        options:
          - app-store-connect
          - ad-hoc
          - development
          - enterprise
        default: app-store-connect
      build_number:
        description: 'Override the iOS build number (CFBundleVersion). Leave empty to use pubspec version.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Pull requests: a newer push cancels the older run. Pushes: one group per
# commit, so every pushed commit gets its own IPA a release can reuse.
concurrency:
  group: ios-build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # Signed when the manual input is on, OR the repo variable is 'true'.
      SIGNING_ENABLED: ${{ inputs.signing_enabled == true || vars.IOS_SIGNING_ENABLED == 'true' }}
      EXPORT_METHOD: ${{ inputs.export_method || 'app-store-connect' }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Keep in step with FLUTTER_VERSION in ci.yml.
      - name: Set up Flutter 3.35.7 (stable)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Bootstrap iOS platform folder (generate + configure)
        run: bash ./.github/scripts/ios_bootstrap.sh
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ inputs.export_method || 'app-store-connect' }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate iOS launcher icons
        run: dart run flutter_launcher_icons

      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ios/Pods
            ~/.cocoapods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'pubspec.yaml', 'pubspec.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        run: |
          command -v pod >/dev/null 2>&1 || sudo gem install cocoapods
          cd ios
          pod install

      # ---------------------------------------------------------------- signing
      - name: Check Apple signing secrets (signed build only)
        if: env.SIGNING_ENABLED == 'true'
        shell: bash
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for s in APPLE_CERT_P12_BASE64 APPLE_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID IOS_BUNDLE_ID; do
            if [ -z "${!s:-}" ]; then missing+=("$s"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::A signed build was requested but these GitHub Secrets are missing/unset: ${missing[*]}"
            echo "::error::Create them in Settings > Secrets and variables > Actions. See docs/iOS_BUILD_GUIDE.md."
            exit 1
          fi
          echo "All required Apple signing secrets are present."

      - name: Install Apple signing certificate
        if: env.SIGNING_ENABLED == 'true'
        shell: bash
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          RUNNER_TEMP="${RUNNER_TEMP:-$TMPDIR}"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          CERT_FILE="$RUNNER_TEMP/apple_distribution.p12"

          # 1) Decode the base64-encoded .p12 signing certificate.
          echo "$APPLE_CERT_P12_BASE64" | base64 -d > "$CERT_FILE"

          # 2) Create a throwaway keychain for this job.
          security create-keychain -p build "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p build "$KEYCHAIN_PATH"

          # 3) Import the certificate (password optional if the .p12 is unencrypted).
          if [ -n "${APPLE_CERT_P12_PASSWORD:-}" ]; then
            security import "$CERT_FILE" -P "$APPLE_CERT_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          else
            security import "$CERT_FILE" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          fi

          # 4) Make codesign able to use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k build "$KEYCHAIN_PATH" >/dev/null 2>&1 || true

          echo "Certificate installed into $KEYCHAIN_PATH"

      - name: Install Apple provisioning profile(s)
        if: env.SIGNING_ENABLED == 'true'
        shell: bash
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILES_DIR/noirplayer.mobileprovision"
          echo "Installed provisioning profile: $(ls -1 "$PROFILES_DIR")"

      # ------------------------------------------------------------------ build
      - name: Build unsigned .app (no codesign)
        if: env.SIGNING_ENABLED != 'true'
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA from .app
        if: env.SIGNING_ENABLED != 'true'
        run: |
          set -euo pipefail
          APP_DIR="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "::error::$APP_DIR not found — the unsigned build failed above." >&2
            exit 1
          fi
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app NoirPlayer-unsigned.ipa
          ls -lh NoirPlayer-unsigned.ipa

      - name: Build signed IPA
        if: env.SIGNING_ENABLED == 'true'
        run: |
          set -euo pipefail
          args=(ipa --release --export-method "$EXPORT_METHOD" --export-options-plist ios/ExportOptions.plist)
          if [ -n "${BUILD_NUMBER:-}" ]; then
            args+=(--build-number "$BUILD_NUMBER")
          fi
          flutter build "${args[@]}"

      # ----------------------------------------------------------------- artifact
      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: noir-player-ios-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/ios/**/*.ipa
            build/ios/iphoneos/Runner.app

